name: CI

# Every push gets the cheap jobs (checks on Linux, make check on one Mac). The module matrix, the release build, the
# renders and the template probes cost about 20 macOS jobs; they run for pull requests, on the default branch and on
# version tags only (condition "full" below), not for every hourly backup push of a working branch.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Read access to the code is all the checks need; a compromised step cannot push or change the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Xcode on the macos-26 runner image; scripts/pick-sdk.sh picks the newest SDK this compiler can read.
  # The build itself never uses xcodebuild or SwiftPM, only swiftc from this developer directory.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # Which module combinations and removals exist here. A project that removed modules keeps this file unchanged, so the
  # matrices come from the module folders that are still there (.github/ci_plan.py), and the starter-only probes are
  # skipped in projects.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      starter: ${{ steps.plan.outputs.starter }}
      combos: ${{ steps.plan.outputs.combos }}
      removals: ${{ steps.plan.outputs.removals }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Module, Kombinationen, Entfernungen
        id: plan
        run: python3 .github/ci_plan.py

  # The Python checks need no Mac; they run on the cheaper Linux runner.
  checks:
    name: Regeln, Texte, Design, Kit, Commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The token stays out of .git/config; no step pushes. The whole history, so the commits of the branch can be
          # checked against origin/main.
          persist-credentials: false
          fetch-depth: 0
      - name: zsh for the Makefile
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # The commit-msg hook runs only locally and can be skipped; CI repeats author and format for every new commit.
      - name: Autor und Format aller Commits, die noch nicht auf main liegen
        run: python3 scripts/check_commit_msg.py --bereich origin/main..HEAD
      - name: Regeln aus rules/ und CLAUDE.md Teil A ohne Abweichung
        run: make check-rules
      # --ci: a finding that was fixed but still sits in rules/baseline/ is an error here (locally only a hint)
      - name: Texte in beiden Sprachen, keine Texte in Views
        run: make check-texts CHECK_FLAGS=--ci
      - name: Nur Design-Tokens außerhalb von Kit/Design
        run: make check-design CHECK_FLAGS=--ci
      - name: Kit-Pfade und Pflichtprüfungen unverändert
        run: make check-kit

  # The modules from starter.json, on every push: everything make check does, then the bundle itself.
  build:
    name: make check (starter.json)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Werkzeuge
        run: make doctor
      - name: make check
        run: make check
      - name: Signatur und Selbsttest ohne Fenster
        run: |
          source build/gen/app.env
          codesign --verify --strict "build/$APP_NAME.app"
          STARTER_HEADLESS=1 "build/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest
      # The tooling must run with the python3 of the Command Line Tools (3.9) on the developer's Mac; python3 on the
      # runner's PATH is a newer Homebrew Python, /usr/bin/python3 is Apple's 3.9.
      - name: Python-Werkzeuge mit /usr/bin/python3 (3.9)
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m py_compile bin/starter .claude/hooks/*.py .github/ci_plan.py
          /usr/bin/python3 -m unittest discover -s scripts/tests -t . -p 'test_*.py'
          if [[ -d scripts/starter/tests ]]; then
            /usr/bin/python3 -m unittest discover -s scripts/starter/tests -t scripts -p 'test_*.py'
          fi

  build-matrix:
    name: Build (${{ matrix.modules }})
    needs: plan
    if: ${{ (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) && needs.plan.outputs.combos != '[]' }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        modules: ${{ fromJSON(needs.plan.outputs.combos) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: make build
        env:
          COMBO: ${{ matrix.modules }}
        run: make build MODULES="$COMBO"
      - name: Signatur und Selbsttest ohne Fenster
        run: |
          source build/gen/app.env
          codesign --verify --strict "build/$APP_NAME.app"
          STARTER_HEADLESS=1 "build/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest

  release-build:
    name: Release-Build
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: make build CONFIG=release
        run: make build CONFIG=release
      - name: Selbsttest ohne Fenster
        run: |
          source build/gen/app.env
          STARTER_HEADLESS=1 "build/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest

  shots:
    name: Renders (en, de, hell, dunkel)
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: make shots
        run: make shots
      - name: Renders als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ github.run_id }}
          path: build/shots/
          retention-days: 14
          if-no-files-found: error

  dmg:
    name: DMG
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: make dmg (ad hoc signiert)
        run: make dmg
      - name: DMG prüfen, ohne Finder
        run: |
          dmg="$(ls build/dmg/*.dmg | head -1)"
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          source build/gen/app.env
          codesign --verify --deep --strict "$mnt/$APP_NAME.app"
          hdiutil detach "$mnt"
      - name: DMG als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ github.ref_name }}
          path: build/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error

  # A new project the way "Use this template" makes one: a fresh copy without the starter's history, bin/starter init,
  # then the checks of a project. It fails when the starter only works in its own repository.
  template-probe:
    name: Template-Probe
    needs: plan
    if: ${{ needs.plan.outputs.starter == 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Frische Kopie ohne Verlauf des Starters
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          git init --quiet
          git config user.name "Probe"
          git config user.email "probe@example.org"
          git add -A
          git commit --quiet -m "chore: template copy"
      - name: bin/starter init
        working-directory: ${{ runner.temp }}/probe
        run: bin/starter init --non-interactive --name Probe --bundle-id org.example.probe --ohne-netz
      # init empties the starter's commit identity; until the project enters its own, the hook refuses every commit.
      - name: Ohne eigene Commit-Identität nimmt der Hook keinen Commit an
        working-directory: ${{ runner.temp }}/probe
        run: |
          make hooks
          git add -A
          if git commit --quiet -m "chore(setup): set up the project"; then
            echo "Commit ohne Commit-Identität in starter.json angenommen"
            exit 1
          fi
      - name: make check
        working-directory: ${{ runner.temp }}/probe
        run: make check

  # Removing a module must leave a project that builds and passes its tests. Each run removes one module (with the
  # modules that need it) from a fresh project; "alle" removes every removable module and checks that the last app
  # form cannot go. Only in the starter, and only for modules that are still there (.github/ci_plan.py).
  module-removal:
    name: Modul entfernen (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.starter == 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.removals) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Frische Kopie und bin/starter init
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          git init --quiet
          git config user.name "Probe"
          git config user.email "probe@example.org"
          git add -A
          git commit --quiet -m "chore: template copy"
          bin/starter init --non-interactive --name Probe --bundle-id org.example.probe --ohne-build --ohne-netz
      - name: Modul entfernen
        working-directory: ${{ runner.temp }}/probe
        env:
          REMOVE: ${{ matrix.remove }}
          STRIP: ${{ matrix.strip }}
          LAST: ${{ matrix.last }}
        run: |
          for name in $REMOVE; do bin/starter remove "$name" --ohne-build; done
          if [[ "$STRIP" == true ]]; then bin/starter strip-examples --ohne-build; fi
          if [[ -n "$LAST" ]] && bin/starter remove "$LAST" --ohne-build; then
            echo "$LAST ließ sich als letzte App-Form entfernen"
            exit 1
          fi
          git add -A
      - name: Build, Selbsttest, Tests
        working-directory: ${{ runner.temp }}/probe
        run: |
          make build
          source build/gen/app.env
          STARTER_HEADLESS=1 "build/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest
          make test
      - name: Keine Reste des Moduls
        working-directory: ${{ runner.temp }}/probe
        run: make check-kit
